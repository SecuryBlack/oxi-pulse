[package]
name = "oxipulse"
version = "0.5.2"
edition = "2024"
license = "Apache-2.0"
description = "Ultralight open source server monitoring agent"
repository = "https://github.com/securyblack/oxi-pulse"

[dependencies]
sb-agent-core = "0.4"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "rt-tokio"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "metrics"] }
prost = "0.14"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# sb-agent-core 0.4 (releases firmadas con ed25519 y órdenes firmadas S4)
# no está publicado en crates.io: el patch lo resuelve desde el tag de GitHub.
# Quitar cuando se publique esa versión del crate.
[patch.crates-io]
sb-agent-core = { git = "https://github.com/SecuryBlack/sb-agent-core.git", tag = "v0.4.0" }
