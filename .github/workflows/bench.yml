name: Linux end-to-end and benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: End-to-end check and benchmark
        run: bash bench/run.sh

      - name: Summary
        if: always()
        run: cat bench/out/results.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: bench/out
