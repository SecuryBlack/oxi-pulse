name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Created as a draft: releases are immutable once published, so the packages
  # are added first and linux-packages publishes it.
  release:
    uses: securyblack/sb-agent-core/.github/workflows/release.yml@master
    with:
      binary-name: oxipulse
      windows-static-crt: true
      glibc: "2.17"
      draft: true
      targets-json: |
        [
          {"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest","archive_ext":"tar.gz","cross":false},
          {"target":"aarch64-unknown-linux-gnu","os":"ubuntu-latest","archive_ext":"tar.gz","cross":true},
          {"target":"x86_64-pc-windows-msvc","os":"windows-latest","archive_ext":"zip","cross":false}
        ]

  # .deb/.rpm packages and the Docker image, from the Linux binaries just built.
  linux-packages:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the Linux binaries of this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}; target=${pair##*:}
            mkdir -p "dist/$arch"
            gh release download "$TAG" -p "oxipulse-${target}-unknown-linux-gnu.tar.gz" -O - | tar xz -C "dist/$arch"
          done
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build and upload .deb and .rpm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz | tar xz -C "$RUNNER_TEMP" nfpm
          mkdir -p pkg
          for arch in amd64 arm64; do
            cp "dist/$arch/oxipulse" dist/oxipulse
            for format in deb rpm; do
              ARCH=$arch "$RUNNER_TEMP/nfpm" package -f packaging/nfpm.yaml -p $format -t pkg/
            done
          done
          ls -l pkg
          (cd pkg && sha256sum * > SHA256SUMS-packages)
          gh release upload "$TAG" pkg/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/securyblack/oxipulse:${{ env.VERSION }}
            ghcr.io/securyblack/oxipulse:latest
          labels: |
            org.opencontainers.image.source=https://github.com/SecuryBlack/oxi-pulse
            org.opencontainers.image.description=Lightweight host metrics agent that sends OpenTelemetry (OTLP) metrics
            org.opencontainers.image.licenses=Apache-2.0
