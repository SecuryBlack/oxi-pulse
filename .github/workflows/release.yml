name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    uses: securyblack/sb-agent-core/.github/workflows/release.yml@main
    with:
      binary-name: oxipulse
      windows-static-crt: true
      targets-json: |
        [
          {"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest","archive_ext":"tar.gz","cross":false},
          {"target":"aarch64-unknown-linux-gnu","os":"ubuntu-latest","archive_ext":"tar.gz","cross":true},
          {"target":"x86_64-pc-windows-msvc","os":"windows-latest","archive_ext":"zip","cross":false}
        ]
