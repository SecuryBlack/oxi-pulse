# OTLP/gRPC receiver, e.g. "http://collector.example.com:4317". Required.
oxipulse_endpoint: ""
# Bearer token, only if your backend needs one. Keep it in Ansible Vault.
oxipulse_token: ""
oxipulse_version: "0.5.3"
oxipulse_interval_secs: 30
# Exports kept while the backend is unreachable (8640 x 30 s = 72 h).
oxipulse_buffer_max_size: 8640
# host:port list; empty = your endpoint and 1.1.1.1:53
oxipulse_latency_targets: []
# Usage ping to SecuryBlack. Unset = off, unless the endpoint is SecuryBlack Cloud.
oxipulse_telemetry_enabled: null
# present or absent
oxipulse_state: present
